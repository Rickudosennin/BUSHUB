<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BUS HUB - Santa Isabel e Arujá</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header>
    <h1>BUS HUB</h1>
    <p>Mobilidade Urbana • Santa Isabel & Arujá</p>
</header>

<div class="container">
    <!-- SELETOR DE CIDADE -->
    <div class="cidade-card">
        <div class="tabs-cidade" id="tabsCidade">
            <button class="cidade-btn active" onclick="selecionarCidade('santa-isabel')">🏙️ SANTA ISABEL</button>
            <button class="cidade-btn" onclick="selecionarCidade('aruja')">🏙️ ARUJÁ</button>
        </div>
    </div>

    <!-- FILTROS -->
    <div class="filtro-card">
        <div class="form-group">
            <label>EMPRESA</label>
            <select id="selectEmpresa" onchange="atualizarLinhas()">
                <option value="">Selecione...</option>
            </select>
        </div>

        <div class="form-group">
            <label>LINHA / DESTINO</label>
            <select id="selectLinha" onchange="carregarQuadroHorario()" disabled>
                <option value="">Aguardando seleção...</option>
            </select>
        </div>
    </div>

    <!-- PAINEL DE HORÁRIOS -->
    <div id="painel" class="main-panel hidden">
        <div class="header-panel">
            <h3 id="nomeLinha"></h3>
            <div class="info-badges">
                <div id="valorTarifa" class="tarifa-badge"></div>
            </div>
        </div>
        <div id="tempoPercurso" class="percurso-info"></div>
        <div id="legendaLinha" class="legenda-info"></div>

        <div class="tab-section" id="sectionSentido">
            <span class="tab-label">PARTIDAS DE:</span>
            <div id="tabsSentido" class="tabs"></div>
        </div>

        <div class="tab-section">
            <span class="tab-label">QUADRO DE HORÁRIOS:</span>
            <div id="tabsDias" class="tabs"></div>
        </div>

        <div id="listaHorarios" class="horarios-list"></div>
    </div>
</div>

<footer>
    <div class="footer-credits">
        Programador e Desenvolvedor: <span>Paulo Cesar</span>
    </div>
    <div class="footer-links">
        <a href="https://www.instagram.com/rickudosennin/" target="_blank" class="insta-link">
            📷 Instagram
        </a>
        <a href="https://wa.me/5511998654703" target="_blank" class="whats-link">
            💬 WhatsApp
        </a>
    </div>
</footer>

<script src="js/app.js"></script>
</body>
</html>
