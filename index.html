<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BUS HUB - Santa Isabel</title>
    <style>
        :root {
            --bg-dark: #0a0b10;
            --card-dark: #161b22;
            --neon-blue: #00d2ff;
            --neon-glow: 0 0 10px rgba(0, 210, 255, 0.5), 0 0 20px rgba(0, 210, 255, 0.3);
            --text-bright: #e6edf3;
            --text-dim: #8b949e;
            --border: #30363d;
            --neon-green: #39ff14;
            --whatsapp-green: #25d366;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            max-width: 100%;
            overflow-x: hidden;
            position: relative;
        }

        body {
            font-family: 'Segoe UI', Roboto, sans-serif;
            background: var(--bg-dark);
            color: var(--text-bright);
            line-height: 1.6;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        header {
            background: var(--card-dark);
            padding: 2rem 1rem;
            text-align: center;
            border-bottom: 2px solid var(--neon-blue);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
            width: 100%;
        }

        header h1 {
            font-size: 2.2rem;
            color: var(--neon-blue);
            text-shadow: var(--neon-glow);
            letter-spacing: 2px;
            font-weight: 800;
        }

        header p {
            color: var(--text-dim);
            text-transform: uppercase;
            font-size: 0.75rem;
            letter-spacing: 2px;
            margin-top: 5px;
        }

        .container {
            width: 100%;
            max-width: 900px;
            margin: 20px auto;
            padding: 0 15px;
            flex: 1;
        }

        .filtro-card {
            background: var(--card-dark);
            padding: 20px;
            border-radius: 15px;
            border: 1px solid var(--border);
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 25px;
        }

        @media (max-width: 600px) {
            .filtro-card {
                grid-template-columns: 1fr;
            }
            header h1 {
                font-size: 1.8rem;
            }
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        label {
            margin-bottom: 8px;
            font-size: 0.7rem;
            color: var(--neon-blue);
            font-weight: bold;
            letter-spacing: 1px;
        }

        select {
            background: #0d1117;
            color: var(--text-bright);
            border: 1px solid var(--border);
            padding: 12px;
            border-radius: 8px;
            font-size: 1rem;
            outline: none;
            width: 100%;
            cursor: pointer;
        }

        .main-panel {
            background: var(--card-dark);
            border-radius: 20px;
            padding: 20px;
            border: 1px solid var(--border);
            margin-bottom: 30px;
        }

        .header-panel {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 10px;
            flex-wrap: wrap;
            gap: 10px;
        }

        #nomeLinha {
            color: var(--text-bright);
            font-size: 1.2rem;
            border-left: 4px solid var(--neon-blue);
            padding-left: 12px;
            flex: 1;
            min-width: 200px;
        }

        .tarifa-badge {
            background: rgba(57, 255, 20, 0.1);
            border: 1px solid var(--neon-green);
            color: var(--neon-green);
            padding: 4px 12px;
            border-radius: 8px;
            font-weight: 800;
            font-size: 0.85rem;
            white-space: nowrap;
        }

        .percurso-info {
            font-size: 0.7rem;
            color: var(--text-dim);
            margin-bottom: 15px;
            padding-left: 16px;
            text-transform: uppercase;
        }

        .tab-section {
            margin-bottom: 20px;
            width: 100%;
        }

        .tab-label {
            font-size: 0.65rem;
            color: var(--text-dim);
            margin-bottom: 8px;
            display: block;
            font-weight: bold;
            letter-spacing: 1px;
        }

        .tabs {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .tab-btn {
            flex: 1;
            min-width: 45%;
            padding: 10px 5px;
            border: 1px solid var(--border);
            background: rgba(255, 255, 255, 0.02);
            color: var(--text-dim);
            border-radius: 8px;
            font-weight: bold;
            font-size: 0.65rem;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .tab-btn:hover {
            border-color: rgba(0, 210, 255, 0.5);
            background: rgba(0, 210, 255, 0.05);
        }

        .tab-btn.active {
            background: rgba(0, 210, 255, 0.1);
            border-color: var(--neon-blue);
            color: var(--neon-blue);
        }

        .horarios-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
            gap: 10px;
        }

        @media (max-width: 400px) {
            .horarios-list {
                grid-template-columns: 1fr 1fr;
            }
            .tab-btn {
                min-width: 100%;
            }
        }

        .hora-item {
            background: #0d1117;
            padding: 12px 5px;
            border-radius: 10px;
            border: 1px solid var(--border);
            text-align: center;
            transition: all 0.3s ease;
        }

        .hora-text {
            font-size: 1.2rem;
            font-weight: 800;
            color: var(--text-bright);
        }

        .hora-info {
            font-size: 0.6rem;
            color: var(--text-dim);
            margin-top: 4px;
        }

        .hora-item.proximo {
            border-color: var(--neon-blue);
            background: rgba(0, 210, 255, 0.05);
            box-shadow: 0 0 15px rgba(0, 210, 255, 0.3);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% {
                box-shadow: 0 0 15px rgba(0, 210, 255, 0.3);
            }
            50% {
                box-shadow: 0 0 25px rgba(0, 210, 255, 0.6);
            }
        }

        .hora-item .observacao {
            font-size: 0.5rem;
            color: var(--text-dim);
            display: block;
            margin-top: 2px;
        }

        footer {
            background: var(--card-dark);
            border-top: 1px solid var(--border);
            padding: 20px;
            text-align: center;
            width: 100%;
        }

        .footer-credits {
            font-size: 0.8rem;
            color: var(--text-bright);
            margin-bottom: 10px;
        }

        .footer-credits span {
            color: var(--neon-blue);
            font-weight: bold;
        }

        .footer-links {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .insta-link {
            display: inline-flex;
            align-items: center;
            color: var(--text-dim);
            text-decoration: none;
            font-size: 0.75rem;
            border: 1px solid var(--border);
            padding: 5px 15px;
            border-radius: 20px;
            transition: all 0.2s ease;
            gap: 5px;
        }

        .insta-link:hover {
            border-color: var(--neon-blue);
            color: var(--neon-blue);
        }

        .whatsapp-link {
            display: inline-flex;
            align-items: center;
            color: var(--whatsapp-green);
            text-decoration: none;
            font-size: 0.75rem;
            border: 1px solid var(--whatsapp-green);
            padding: 5px 15px;
            border-radius: 20px;
            transition: all 0.2s ease;
            gap: 5px;
        }

        .whatsapp-link:hover {
            background: rgba(37, 211, 102, 0.1);
            box-shadow: 0 0 10px rgba(37, 211, 102, 0.3);
        }

        .hidden {
            display: none;
        }

        /* ========== BOTÃO FLUTUANTE WHATSAPP ========== */
        .whatsapp-float {
            position: fixed;
            width: 60px;
            height: 60px;
            bottom: 25px;
            right: 25px;
            background-color: var(--whatsapp-green);
            color: white;
            border-radius: 50%;
            text-align: center;
            box-shadow: 0 4px 15px rgba(37, 211, 102, 0.4);
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: pulse-whatsapp 2s infinite;
            transition: all 0.3s ease;
            text-decoration: none;
        }

        .whatsapp-float:hover {
            background-color: #20ba57;
            transform: scale(1.1);
            box-shadow: 0 6px 20px rgba(37, 211, 102, 0.6);
        }

        .whatsapp-float:active {
            transform: scale(0.95);
        }

        @keyframes pulse-whatsapp {
            0%, 100% {
                box-shadow: 0 0 0 0 rgba(37, 211, 102, 0.5);
            }
            50% {
                box-shadow: 0 0 0 18px rgba(37, 211, 102, 0);
            }
        }

        /* Tooltip ao passar o mouse */
        .whatsapp-float::after {
            content: "Precisa de ajuda?";
            position: absolute;
            right: 70px;
            background: var(--card-dark);
            color: var(--text-bright);
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 0.7rem;
            white-space: nowrap;
            border: 1px solid var(--border);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .whatsapp-float:hover::after {
            opacity: 1;
        }

        @media (max-width: 600px) {
            .whatsapp-float {
                width: 55px;
                height: 55px;
                bottom: 20px;
                right: 15px;
            }
            .whatsapp-float::after {
                display: none;
            }
        }
    </style>
</head>

    let linhaAtiva = null;
    let sentidoAtivo = "";
    let diaAtivo = "";

    function atualizarLinhas() {
        const emp = document.getElementById('selectEmpresa').value;
        const selectLinha = document.getElementById('selectLinha');
        selectLinha.innerHTML = '<option value="">Escolha a linha...</option>';
        
        document.getElementById('painel').classList.add('hidden');
        
        if (emp && db[emp]) {
            db[emp].forEach(l => {
                let opt = document.createElement('option');
                opt.value = l.id;
                opt.textContent = l.nome;
                selectLinha.appendChild(opt);
            });
            selectLinha.disabled = false;
        } else {
            selectLinha.disabled = true;
        }
    }

    function carregarQuadroHorario() {
        const emp = document.getElementById('selectEmpresa').value;
        const id = document.getElementById('selectLinha').value;
        if (!id) return;

        linhaAtiva = db[emp].find(l => l.id === id);
        document.getElementById('nomeLinha').innerText = linhaAtiva.nome;
        
        const tarifaEl = document.getElementById('valorTarifa');
        if (linhaAtiva.tarifa) {
            tarifaEl.innerText = "TARIFA: " + linhaAtiva.tarifa;
            tarifaEl.style.display = 'inline-block';
        } else {
            tarifaEl.style.display = 'none';
        }

        const percursoEl = document.getElementById('tempoPercurso');
        if (linhaAtiva.percurso) {
            percursoEl.innerText = "Tempo de Percurso: " + linhaAtiva.percurso;
            percursoEl.style.display = "block";
        } else {
            percursoEl.style.display = "none";
        }

        document.getElementById('painel').classList.remove('hidden');
        
        sentidoAtivo = Object.keys(linhaAtiva.trajetos)[0];
        diaAtivo = Object.keys(linhaAtiva.trajetos[sentidoAtivo])[0];

        renderizarMenus();
        renderizarHorarios();
    }

    function renderizarMenus() {
        const boxSentido = document.getElementById('tabsSentido');
        const boxDias = document.getElementById('tabsDias');
        const sentidos = Object.keys(linhaAtiva.trajetos);

        document.getElementById('sectionSentido').style.display = sentidos.length > 1 ? 'block' : 'none';

        boxSentido.innerHTML = sentidos.map(s => `
            <button class="tab-btn ${s === sentidoAtivo ? 'active' : ''}" onclick="mudarSentido('${s}')">${s}</button>
        `).join('');

        const dias = Object.keys(linhaAtiva.trajetos[sentidoAtivo]);
        boxDias.innerHTML = dias.map(d => `
            <button class="tab-btn ${d === diaAtivo ? 'active' : ''}" onclick="mudarDia('${d}')">${d}</button>
        `).join('');
    }

    function mudarSentido(s) {
        sentidoAtivo = s;
        diaAtivo = Object.keys(linhaAtiva.trajetos[sentidoAtivo])[0];
        renderizarMenus();
        renderizarHorarios();
    }

    function mudarDia(d) {
        diaAtivo = d;
        renderizarMenus();
        renderizarHorarios();
    }

    function extrairHora(horarioString) {
        let apenasHora = horarioString.split('|')[0].trim();
        apenasHora = apenasHora.replace(':', 'h');
        
        if (!apenasHora.includes('h')) {
            apenasHora = apenasHora + 'h00';
        }
        
        const partes = apenasHora.split('h');
        const horas = partes[0].padStart(2, '0');
        const minutos = (partes[1] || '00').padStart(2, '0');
        
        return horas + 'h' + minutos;
    }

    function renderizarHorarios() {
        const lista = document.getElementById('listaHorarios');
        const horarios = linhaAtiva.trajetos[sentidoAtivo][diaAtivo];
        
        const agora = new Date();
        const horaAtual = agora.getHours().toString().padStart(2, '0') + 'h' + 
                          agora.getMinutes().toString().padStart(2, '0');

        if (!horarios || horarios.length === 0 || 
            (horarios.length === 1 && horarios[0].toLowerCase().includes("não opera"))) {
            lista.innerHTML = '<p style="grid-column: 1/-1; text-align: center; color: var(--text-dim); padding: 20px;">Não opera neste dia.</p>';
            return;
        }

        const horariosFormatados = horarios.map(h => extrairHora(h));

        let indiceProximo = -1;
        for (let i = 0; i < horariosFormatados.length; i++) {
            if (horariosFormatados[i] > horaAtual) {
                indiceProximo = i;
                break;
            }
        }

        if (indiceProximo === -1 && horarios.length > 0) {
            indiceProximo = 0;
        }

        lista.innerHTML = horarios.map((h, index) => {
            let textoExibicao = h;
            let observacao = "";
            
            if (h.includes('|')) {
                const partes = h.split('|');
                textoExibicao = partes[0].trim();
                observacao = partes[1].trim();
            }

            const classeProximo = (index === indiceProximo) ? "proximo" : "";

            return `
                <div class="hora-item ${classeProximo}">
                    <div class="hora-text">${textoExibicao}</div>
                    ${observacao ? `<span class="observacao">${observacao}</span>` : ''}
                    <div class="hora-info">Partida</div>
                </div>
            `;
        }).join('');
    }
